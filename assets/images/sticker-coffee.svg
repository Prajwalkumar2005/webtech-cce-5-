<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <filter id="cup-shadow" x="-10%" y="-10%" width="125%" height="125%">
    <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#44121D" flood-opacity="0.15"/>
  </filter>
  <g filter="url(#cup-shadow)">
    <!-- White border -->
    <path d="M42,50 L52,175 C53,185 62,192 72,192 L92,192 C102,192 111,185 112,175 L122,50 Z" 
          fill="#FFFFFF" stroke="#F3D9D7" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Straw -->
    <rect x="92" y="10" width="12" height="60" rx="4" fill="#8F1728" transform="rotate(12 92 10)"/>

    <!-- Cup Body -->
    <path d="M44,55 L52,175 C53,183 60,188 70,188 L94,188 C104,188 111,183 112,175 L120,55 Z" fill="#FFF8F2"/>
    
    <!-- Matcha/Latte Level -->
    <path d="M47,95 L52,175 C53,183 60,188 70,188 L94,188 C104,188 111,183 112,175 L117,95 Z" fill="#8FA87B"/>
    <path d="M45,75 L47,95 L117,95 L119,75 Z" fill="#E8D1B5"/>

    <!-- Cup Lid -->
    <rect x="36" y="44" width="92" height="15" rx="7" fill="#8F1728"/>
    <rect x="52" y="38" width="60" height="9" rx="4" fill="#FFF8F2"/>

    <!-- Sleeve -->
    <path d="M47,105 L50,150 L114,150 L117,105 Z" fill="#E9BFC2"/>
    <circle cx="82" cy="127" r="14" fill="#8F1728"/>
    <!-- Small heart on sleeve -->
    <path d="M82,132 C82,132 75,126 75,122 C75,119 78,117 80,118 C82,119 82,121 82,121 C82,121 82,119 84,118 C86,117 89,119 89,122 C89,126 82,132 82,132 Z" fill="#FFF8F2"/>
  </g>
</svg>