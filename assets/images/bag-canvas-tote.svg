<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="toteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#F5E8E0"/>
    </linearGradient>
    <filter id="toteShd" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#44121D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#toteBg)" rx="24"/>
  <circle cx="200" cy="210" r="130" fill="#E9BFC2" opacity="0.3"/>

  <g filter="url(#toteShd)">
    <!-- Canvas Long Handles -->
    <path d="M150,180 C150,60 170,40 175,40 C180,40 200,60 200,180" fill="none" stroke="#8F1728" stroke-width="14" stroke-linecap="round"/>
    <path d="M200,180 C200,60 220,40 225,40 C230,40 250,60 250,180" fill="none" stroke="#5C0E1B" stroke-width="14" stroke-linecap="round"/>

    <!-- Tote Canvas Body -->
    <path d="M110,165 L290,165 L275,340 C273,348 266,354 258,354 L142,354 C134,354 127,348 125,340 Z" fill="#FFFDFB" stroke="#EAE0D5" stroke-width="2"/>
    
    <!-- Canvas Texture / Seams -->
    <line x1="150" y1="165" x2="150" y2="354" stroke="#8F1728" stroke-width="8" stroke-opacity="0.85"/>
    <line x1="250" y1="165" x2="250" y2="354" stroke="#8F1728" stroke-width="8" stroke-opacity="0.85"/>

    <!-- Editorial Canvas Graphic Print -->
    <rect x="165" y="215" width="70" height="70" rx="35" fill="#F3D9D7"/>
    <text x="200" y="246" font-family="'DM Serif Display', Georgia, serif" font-size="14" fill="#8F1728" text-anchor="middle">BAGÉRA</text>
    <text x="200" y="262" font-family="'DM Sans', sans-serif" font-size="7" font-weight="700" fill="#44121D" text-anchor="middle" letter-spacing="1.5">EVERYDAY TOTE</text>
    <circle cx="200" cy="272" r="2" fill="#8F1728"/>
  </g>
</svg>