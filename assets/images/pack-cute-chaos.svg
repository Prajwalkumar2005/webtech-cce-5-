<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="packGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="100%" stop-color="#F3D9D7"/>
    </linearGradient>
    <filter id="p-shd" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#44121D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#p-shd)">
    <!-- Envelope / Pack Pouch -->
    <rect x="25" y="20" width="250" height="200" rx="18" fill="url(#packGrad1)" stroke="#8F1728" stroke-width="2.5"/>
    <rect x="35" y="30" width="230" height="45" rx="8" fill="#8F1728"/>
    <text x="150" y="58" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#FFF8F2" text-anchor="middle" letter-spacing="1">CUTE CHAOS</text>
    
    <!-- Sticker preview doodles inside pouch -->
    <circle cx="95" cy="125" r="28" fill="#FFFFFF" stroke="#F3D9D7" stroke-width="2"/>
    <!-- cherry -->
    <circle cx="85" cy="132" r="10" fill="#8F1728"/>
    <circle cx="102" cy="130" r="9" fill="#8F1728"/>
    <path d="M85,130 C90,112 95,110 95,108 C95,110 100,112 102,128" stroke="#4B6B40" stroke-width="2" fill="none"/>

    <!-- bow -->
    <circle cx="195" cy="125" r="28" fill="#FFFFFF" stroke="#F3D9D7" stroke-width="2"/>
    <path d="M195,120 C182,108 174,124 190,126 Z" fill="#E9BFC2"/>
    <path d="M195,120 C208,108 216,124 200,126 Z" fill="#E9BFC2"/>
    <circle cx="195" cy="122" r="5" fill="#8F1728"/>

    <!-- bottom tag -->
    <rect x="70" y="175" width="160" height="28" rx="14" fill="#44121D"/>
    <text x="150" y="194" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF8F2" text-anchor="middle">6 DIE-CUT STICKERS • ₹79</text>
  </g>
</svg>