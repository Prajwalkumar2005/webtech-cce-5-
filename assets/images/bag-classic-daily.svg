<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44121D"/>
      <stop offset="100%" stop-color="#25191B"/>
    </linearGradient>
    <filter id="cdShd" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#44121D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F2" rx="24"/>
  <circle cx="200" cy="200" r="140" fill="#FCEEEB"/>

  <g filter="url(#cdShd)">
    <!-- Top Sturdy Handle -->
    <path d="M150,175 C150,120 250,120 250,175" fill="none" stroke="#25191B" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Gold attachments -->
    <rect x="142" y="170" width="16" height="12" rx="3" fill="#E5B26E"/>
    <rect x="242" y="170" width="16" height="12" rx="3" fill="#E5B26E"/>

    <!-- Trapezoid Satchel Body -->
    <path d="M130,175 L270,175 L295,315 C296,322 290,328 282,328 L118,328 C110,328 104,322 105,315 Z" fill="url(#cdGrad)"/>
    
    <!-- Front Enveloping Flap -->
    <path d="M130,175 L270,175 L260,255 L200,280 L140,255 Z" fill="#5C0E1B" stroke="#8F1728" stroke-width="1.5"/>
    
    <!-- Polished Gold Lock -->
    <circle cx="200" cy="270" r="12" fill="#E5B26E"/>
    <rect x="198" y="266" width="4" height="8" fill="#44121D"/>
  </g>
</svg>