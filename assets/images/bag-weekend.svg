<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C1622"/>
      <stop offset="70%" stop-color="#44121D"/>
      <stop offset="100%" stop-color="#25191B"/>
    </linearGradient>
    <filter id="wkShd" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#44121D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FFF8F2" rx="24"/>
  <circle cx="200" cy="200" r="140" fill="#FCEEEB"/>

  <g filter="url(#wkShd)">
    <!-- Dual Shoulder Straps -->
    <path d="M125,200 C125,90 190,70 190,200" fill="none" stroke="#8F1728" stroke-width="10" stroke-linecap="round"/>
    <path d="M210,200 C210,70 275,90 275,200" fill="none" stroke="#5C0E1B" stroke-width="10" stroke-linecap="round"/>

    <!-- Slouchy Hobo / Weekend Silhouette -->
    <path d="M100,200 C95,290 115,325 150,330 L250,330 C285,325 305,290 300,200 C270,225 230,230 200,230 C170,230 130,225 100,200 Z" fill="url(#wkGrad)"/>
    
    <!-- Zipper Top Line -->
    <path d="M100,200 C130,225 170,230 200,230 C230,230 270,225 300,200" fill="none" stroke="#E5B26E" stroke-width="3" stroke-dasharray="6,2"/>
    <circle cx="200" cy="230" r="6" fill="#E5B26E"/>

    <!-- Luggage Tag Charm -->
    <rect x="245" y="225" width="22" height="35" rx="3" fill="#FFF8F2" stroke="#8F1728" stroke-width="1.5" transform="rotate(15 255 240)"/>
    <line x1="245" y1="210" x2="255" y2="225" stroke="#8F1728" stroke-width="2"/>
  </g>
</svg>